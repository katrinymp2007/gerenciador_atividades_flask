{% extends "base.html" %}{% block title %}{% if atividade %}Editar{% else %}Nova{% endif %} atividade{% endblock %}{% block content %}<section class="form-head"><a href="{{url_for('main.inicio')}}">← Voltar</a><h1>{% if atividade %}Editar atividade{% else %}Nova atividade{% endif %}</h1></section><form class="form" method="post"><label>Título *<input name="titulo" required value="{{atividade['titulo'] if atividade else ''}}"></label><label>Descrição<textarea name="descricao" rows="5">{{atividade['descricao'] if atividade else ''}}</textarea></label><div class="grid"><label>Data<input type="date" name="data_entrega" value="{{atividade['data_entrega'] if atividade else ''}}"></label><label>Prioridade<select name="prioridade">{% for x in prioridades %}<option {% if (atividade and atividade['prioridade']==x) or (not atividade and x=='Média') %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label>{% if atividade %}<label>Status<select name="status">{% for x in status_opcoes %}<option {% if atividade['status']==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label>{% endif %}</div><div class="actions"><a class="btn secondary" href="{{url_for('main.inicio')}}">Cancelar</a><button class="btn primary">Salvar</button></div></form>{% endblock %}
