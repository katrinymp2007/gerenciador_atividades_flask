<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Gerenciador{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header><div class="container top"><a class="logo" href="{{url_for('main.inicio')}}">Gerenciador de Atividades</a><a class="btn primary" href="{{url_for('main.nova_atividade')}}">+ Nova atividade</a></div></header><main class="container">{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer><div class="container">Projeto acadêmico — Flask + SQLite</div></footer></body></html>
